name: Validate and publish event website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate source and event APIs
        run: |
          node --check app.js
          node --check platform.js
          node --check platform-admin.js
          node --test tests/*.test.mjs
          python -B scripts/check_site.py
          python -B -m unittest discover -s server -p 'test_*.py'
          python -B -m unittest discover -s deploy -p 'test_*.py'

  deploy:
    needs: validate
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Stage public files
        run: |
          mkdir _site
          cp index.html styles.css app.js favicon.svg team-registration.js team-registration.css _site/
          cp -r assets downloads _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
