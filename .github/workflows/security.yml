name: Security and edge checks
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '31 4 * * 1'

permissions:
  contents: read

jobs:
  python:
    name: Python lint, types and locked dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: --require-hashes -r backend/requirements.txt
          python -m pip install -r tools/security/requirements.txt
      - name: Catch invalid expressions and undefined names across runtime, operator and test code
        run: ruff check --target-version py311 --select E9,F63,F7,F82,B012 --exclude 'tests/backend/fixtures' backend ops tools tests
      - name: Check deployment configuration and frontend manifest types
        run: mypy --strict --cache-dir /tmp/gotc-mypy ops/deploy/nginx.py tools/build_frontend.py
      - name: Check HTTP, authentication and gateway admission
        run: |
          auth="backend/gotc/admin_auth.py backend/gotc/service.py backend/gotc/credentials.py"
          admission="backend/gotc/gateway/admission.py backend/gotc/password_capacity.py"
          ruff check --target-version py311 --select F,B,ASYNC210,ASYNC230,ASYNC251 backend/gotc/http $auth $admission
          mypy --follow-imports=silent --check-untyped-defs --warn-unused-ignores backend/gotc/http $auth
          mypy --follow-imports=silent --strict $admission
      - name: Audit the complete hash-pinned runtime closure
        run: pip-audit --strict --disable-pip --require-hashes -r backend/requirements.txt

  secrets:
    name: Scan checked-out source for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify Gitleaks and scan the checked-out revision with redacted output
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          mkdir "$RUNNER_TEMP/source"
          git archive HEAD | tar -xf - -C "$RUNNER_TEMP/source"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/source" --redact=100 --no-banner --config tools/security/gitleaks.toml

  nginx:
    name: Nginx config and HTTPS asset contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Nginx for the disposable TLS server
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends nginx
      - name: Validate rendered configuration and HTTPS delivery
        run: |
          nginx -v
          openssl version
          python3 -B -m unittest discover -v -s tests/operations -p test_nginx.py
