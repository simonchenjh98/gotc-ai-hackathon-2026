name: Pull request checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Set up Python for static-site checks
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          find frontend/static -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Run browser-side tests
        run: node --test tests/frontend/*.test.mjs
      - name: Validate public site references
        run: python -B tools/check_site.py

  browser:
    name: Chromium participant and organizer workflows
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test-only Chromium and Playwright
        run: |
          python -m pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Exercise the local platform with synthetic accounts
        run: python -B tests/browser/smoke.py --smoke-only

  backend:
    name: Backend checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run API tests
        run: python -B -m unittest discover -s tests/backend
      - name: Compile Python sources
        run: python -m compileall -q backend tools ops
      - name: Rehearse packaged startup and installation
        run: python -B -m unittest discover -s tests/operations

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate repository layout
        run: python -B tools/check_layout.py
      - name: Run pre-commit checks
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files
